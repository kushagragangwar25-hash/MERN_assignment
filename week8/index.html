<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Top Header -->
    <header class="header">
      <h1>My Dashboard</h1>
    </header>

    <!-- Sidebar / Menu -->
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content Area with Stat Cards -->
    <main class="main-content">
      
      <div class="card">
        <i class="fa-solid fa-user card-icon blue-icon"></i>
        <div class="card-info">
          <h2>120</h2>
          <p>Users</p>


        </div>
      </div>

      <div class="card">
        <i class="fa-solid fa-sack-dollar card-icon orange-icon"></i>
        <div class="card-info">
          <h2>Rs 45k</h2>
          <p>Sales</p>
        </div>
      </div>

      <div class="card">
        <i class="fa-solid fa-box card-icon brown-icon"></i>

        




        <div class="card-info">
          <h2>36</h2>
          <p>Orders</p>
        </div>
      </div>

      <div class="card">
        <i class="fa-solid fa-star card-icon yellow-icon"></i>
        <div class="card-info">
          <h2>4.8</h2>
          <p>Rating</p>
